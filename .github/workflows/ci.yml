name: 🚀 CI Pipeline - Phenikaa News & Entertainment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: 🧪 Lint + Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Type Check (Lint)
        run: npm run lint

      - name: ✅ Run Unit Tests (9 test cases)
        run: npm test

      - name: 📊 Test Summary
        if: always()
        run: |
          echo "==========================="
          echo "✅ Unit Tests for summarizeLogic"
          echo "  - validateSummarizeRequest"
          echo "  - calculateWordCount"
          echo "  - estimateReadTime"
          echo "  - buildSystemPrompt / buildUserPrompt"
          echo "==========================="

  build-check:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle (Vite)
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'placeholder_for_build' }}

      - name: 📁 Verify dist folder exists
        run: |
          test -d dist && echo "✅ dist/ folder created successfully" || (echo "❌ Build failed - dist/ missing" && exit 1)
